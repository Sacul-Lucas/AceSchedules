name: Test AceSchedules Frontend

on:
  pull_request:
    branches: [ "God" ]
  push:
    branches: [ "God" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./AceSchedules_frontend

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: AceSchedules_frontend/yarn.lock

      - name: Instalar dependências
        run: yarn install

      - name: Lint código
        run: yarn lint || echo "Lint não configurado, pulando..."

      - name: Testes unitários
        run: yarn test || echo "Testes não configurados, pulando..."

      - name: Build para verificação
        run: yarn build

      - name: Verificar build
        run: |
          if [ -d "dist" ]; then
            echo "✅ Build OK! Tamanho:"
            du -sh dist/* || true
          else
            echo "❌ Build falhou"
            exit 1
          fi
