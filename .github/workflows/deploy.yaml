# This is a basic workflow to help you get started with Actions

name: Deploy Vite AceSchedules Site to GitHub Pages

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "God" branch
  push:
    branches: [ "God" ]
  pull_request:
    branches: [ "God" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./AceSchedules_frontend

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Instalar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.14.0'

      - name: Instalar dependências
        run: yarn install

      - name: Build do projeto
        run: yarn build

      - name: Deploy para GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./AceSchedules_frontend/dist
